env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

monitor=,preferred,auto,1

$terminal = kitty
$fileManager = kitty -e yazi
$menu = wofi --show drun

general {
    gaps_in = 5
    gaps_out = 10

    border_size = 2

    col.active_border = rgba(B18CFFFF)
    col.inactive_border = rgba(B18CFF99)

    resize_on_border = true

    allow_tearing = false

    layout = dwindle
}

decoration {
    active_opacity = 0.95
    inactive_opacity = 0.85
    rounding = 4

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(7F00FFee)
    }

    blur {
        enabled = true
        size = 3
        passes = 2

        vibrancy = 0.1696
    }
}

animations {
    enabled = true
    bezier = wind, 0.05, 0.9, 0.1, 1.05
    bezier = winIn, 0.1, 1.1, 0.1, 1.1
    bezier = winOut, 0.3, -0.3, 0, 1
    bezier = liner, 1, 1, 1, 1
    animation = windows, 1, 6, wind, slide
    animation = windowsIn, 1, 6, winIn, slide
    animation = windowsOut, 1, 5, winOut, slide
    animation = windowsMove, 1, 5, wind, slide
    animation = border, 1, 1, liner
    animation = borderangle, 1, 30, liner, once
    animation = fade, 1, 10, default
    animation = workspaces, 1, 5, wind
}

dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}

input {
    kb_layout = us,ru
    kb_variant =
    kb_model =
    kb_options = grp:alt_shift_toggle
    kb_rules =

    follow_mouse = 1

    sensitivity = 0

    touchpad {
        natural_scroll = true
    }
}

gestures {
    workspace_swipe = true
}

device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

$mainMod = SUPER

bind = $mainMod, Return, exec, $terminal
bind = $mainMod, C, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, R, exec, $menu
bind = $mainMod, P, pseudo,
bind = $mainMod, J, togglesplit,
bind = $mainMod, L, exec, lockscreen.sh
bind = $mainMod, I, exec, wlogout
bind = $mainMod, W, exec, select_wallpaper.sh
bind = $mainMod, O, exec, emoji.sh

bind = $mainMod SHIFT, S, exec, grim -g "$(slurp)" - | swappy -f -
bind = $mainMod SHIFT, X, exec, hyprpicker | tr -d '\n' | wl-copy

bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = SUPER SHIFT, H, movewindow, l
bind = SUPER SHIFT, L, movewindow, r
bind = SUPER SHIFT, K, movewindow, u
bind = SUPER SHIFT, J, movewindow, d 

bindel = $mainMod SHIFT, right, resizeactive, 10 0
bindel = $mainMod SHIFT, left, resizeactive, -10 0
bindel = $mainMod SHIFT, up, resizeactive, 0 -10
bindel = $mainMod SHIFT, down, resizeactive, 0 10

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

bindm = $mainMod, mouse:272, movewindow

bindel = , XF86AudioRaiseVolume, exec, volume.sh up
bindel = , XF86AudioLowerVolume, exec, volume.sh down
bind = , XF86AudioMute, exec, volume.sh mute
bind = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, hyprctl hyprsunset gamma +10
bindel = ,XF86MonBrightnessDown, exec, hyprctl hyprsunset gamma -10
bind = , XF86AudioPlay, exec, media.sh --pause
bind = , XF86AudioNext, exec, media.sh --nxt
bind = , XF86AudioPrev, exec, media.sh --prv
bind = , XF86AudioStop, exec, media.sh --stop

xwayland:force_zero_scaling = true
windowrulev2 = suppressevent maximize, class:.*
windowrulev2 = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0

exec-once = pulseaudio --start
exec-once = mpd ~/.config/mpd/mpd.conf
exec-once = waybar
exec-once = hypridle
exec-once = hyprpaper
exec-once = dunst
exec-once = hyprsunset
exec-once = kanshi
exec-once = sleep 0.25 && select_random_wallpaper.sh

workspace = 1, defaultName: 一
workspace = 2, defaultName: 二
workspace = 3, defaultName: 三
workspace = 4, defaultName: 四
workspace = 5, defaultName: 五
workspace = 6, defaultName: 六
workspace = 7, defaultName: 七
workspace = 8, defaultName: 八
workspace = 9, defaultName: 九
workspace = 10, defaultName: 十
